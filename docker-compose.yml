services:
  po-packing-list:
    build: .
    image: po-packing-list:latest
    container_name: po-packing-list
    ports:
      - "8003:8003"
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8003
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    # optional: mount the source folder to live-edit without rebuilding
    # volumes:
    #   - ./:/app
