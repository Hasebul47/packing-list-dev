name: Deploy PO Packing List

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "==> Navigating to project directory: ${{ secrets.PROJECT_PATH }}"
            mkdir -p "${{ secrets.PROJECT_PATH }}"
            cd "${{ secrets.PROJECT_PATH }}"
            echo "==> Working directory: $(pwd)"

            if [ ! -d ".git" ]; then
              echo "==> No local .git found in $(pwd). Initializing repository here..."
              git init
              git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            else
              echo "==> Updating remote URL..."
              git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git || \
              git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            fi

            echo "==> Fetching and checking out latest code into $(pwd)..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Verifying files in $(pwd):"
            ls -la

            if [ ! -f "Dockerfile" ]; then
              echo "Error: Dockerfile was not found in $(pwd)!"
              exit 1
            fi

            echo "==> Checking container engine (podman / docker)..."
            CONTAINER_CMD="podman"
            if ! command -v podman &> /dev/null; then
              CONTAINER_CMD="docker"
            fi
            echo "==> Using engine: $CONTAINER_CMD"

            echo "==> Building container image..."
            $CONTAINER_CMD build -f Dockerfile -t po-packing-list:latest .

            echo "==> Stopping and removing existing container (if running)..."
            $CONTAINER_CMD stop po-packing-list || true
            $CONTAINER_CMD rm -f po-packing-list || true

            echo "==> Starting updated container..."
            ENV_FILE_FLAG=""
            if [ -f .env ]; then
              echo "==> Detected .env file; loading environment variables"
              ENV_FILE_FLAG="--env-file .env"
            fi

            $CONTAINER_CMD run -d \
              --name po-packing-list \
              --restart unless-stopped \
              -p 8003:8003 \
              -e TZ=Asia/Dhaka \
              $ENV_FILE_FLAG \
              po-packing-list:latest

            echo "==> Verifying container status..."
            sleep 3
            $CONTAINER_CMD ps --filter name=po-packing-list
            echo "==> Deployment completed successfully!"
